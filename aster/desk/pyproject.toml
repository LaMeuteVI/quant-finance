[project]
name = "aster-desk"
version = "0.1.0"
description = "Aster quant research & crypto trading desk: data, backtest, validation, ledger, risk gate, execution."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "pyarrow>=15",
    "pyyaml>=6",
    "ccxt>=4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
desk = "aster.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
